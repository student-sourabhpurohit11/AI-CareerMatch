    <!--
      SPA redirect restore script (pairs with public/404.html).
      Converts ?p=/dashboard back into a real history entry before React boots.
    -->
    <script>
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Also handle the ?p= query param set by 404.html
        var search = window.location.search;
        if (search && search.slice(1, 3) === 'p=') {
          var decoded = search.slice(1).split('&').reduce(function(o, kv) {
            var parts = kv.split('=');
            o[parts[0]] = parts.slice(1).join('=').replace(/~and~/g, '&');
            return o;
          }, {});
          var newUrl =
            window.location.pathname.slice(0, -1) +
            (decoded.p || '') +
            (decoded.q ? '?' + decoded.q : '') +
            window.location.hash;
          history.replaceState(null, null, newUrl);
        }
      })();
    </script>
