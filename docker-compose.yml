version: '3.8'

services:
  # MySQL 8.0 Relational Database
  mysql_db:
    image: mysql:8.0
    container_name: aicareermatch_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Root@1234Password
      MYSQL_DATABASE: aicareermatch_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    container_name: aicareermatch_backend
    restart: always
    environment:
      - MYSQL_HOST=mysql_db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Root@1234Password
      - MYSQL_DB=aicareermatch_db
      - SECRET_KEY=c48d2e8fae8371900bba68903c706fe2d7ca8e3b7b329ad01ff80931d87e02e1
    ports:
      - "8000:8000"
    depends_on:
      mysql_db:
        condition: service_healthy
    volumes:
      - resume_uploads:/app/uploads/resumes

  # React Frontend Service
  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    container_name: aicareermatch_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  resume_uploads:
