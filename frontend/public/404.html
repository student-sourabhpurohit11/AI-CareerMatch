<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI-CareerMatch</title>
    <!--
      GitHub Pages SPA redirect trick.
      When GitHub Pages serves a 404 for a deep URL like /AI-CareerMatch/dashboard,
      this page captures the path and redirects back to index.html with the path
      encoded as a query param. The script in index.html then restores it.
      See: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var segmentCount = 1; // number of path segments in the repo name (1 for /AI-CareerMatch)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
        '/?p=/' + l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
