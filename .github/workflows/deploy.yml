name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Sets permissions so the workflow can push to the gh-pages branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy

    steps:
      # 1. Check out the full repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js (matches the Vite/React 19 requirements)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Install frontend dependencies
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 4. Build the Vite app.
      #    GITHUB_ACTIONS=true is automatically set, which vite.config.js uses
      #    to apply base: '/AI-CareerMatch/' for correct asset paths on GH Pages.
      #    VITE_API_URL points to your deployed backend (update this value
      #    once your backend is live on a public URL).
      - name: Build production bundle
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://your-backend-url.com/api' }}
        run: npm run build

      # 5. Deploy the dist/ folder to the gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          # Keeps the custom domain file if you add one later
          keep_files: false
          # Commit message shown in gh-pages branch history
          commit_message: 'Deploy: ${{ github.sha }}'

